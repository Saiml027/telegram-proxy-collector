name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: pip install requests telethon
    - run: python main.py --top 200
      env:
        MTPROXY_API_ID: ${{ secrets.MTPROXY_API_ID }}
        MTPROXY_API_HASH: ${{ secrets.MTPROXY_API_HASH }}
    - run: |
        cp verified/proxy_ru_verified.txt proxy_ru.txt
        cp verified/proxy_eu_verified.txt proxy_eu.txt
        cp verified/proxy_all_verified.txt proxy_all.txt
        cp verified/socks5_proxies.txt socks5.txt || true
    - run: |
        git config user.name "Proxy Bot"
        git config user.email "bot@github.com"
        git add verified/ proxy_ru.txt proxy_eu.txt proxy_all.txt socks5.txt || true
        git diff --staged --quiet || git commit -m "Verified proxies $(date)"
        git push || true
    - name: Send to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        echo "=== DEBUG START ==="
        echo "TG_BOT length: ${#TG_BOT}"
        echo "TG_CHAT: $TG_CHAT"
        echo "Current directory: $(pwd)"
        echo "Files in current dir:"
        ls -la
        echo "--- proxy_ru.txt content (first 10 lines): ---"
        head -n 10 proxy_ru.txt 2>&1 || echo "File not found or empty"
        echo "--- grep for proxy links: ---"
        grep -E '^https?://t\.me/proxy\?' proxy_ru.txt | head -n 5 || echo "No matches found"
        echo "=== DEBUG END ==="
        
        if [ -f proxy_ru.txt ]; then
          echo "proxy_ru.txt exists"
          PROXIES=$(grep -E '^https?://t\.me/proxy\?' proxy_ru.txt | head -n 3)
          if [ -n "$PROXIES" ]; then
            echo "Found proxies: $PROXIES"
            MESSAGE="Новые прокси для РФ%0A%0A$PROXIES"
            echo "Sending to Telegram..."
            curl -v -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d text="${MESSAGE}"
            echo "Curl exit code: $?"
          else
            echo "PROXIES is empty"
          fi
        else
          echo "proxy_ru.txt does NOT exist"
        fi
