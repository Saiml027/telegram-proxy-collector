name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download verified proxies
      run: |
        curl -s -o proxy_eu.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/verified/proxy_eu_verified.txt
    
    - name: Check and filter proxies
      run: |
        # Извлекаем полные ссылки
        grep 'tg://proxy' proxy_eu.txt | grep 'secret=ee' > all_proxies.txt
        
        # Файл для рабочих прокси
        > working_proxies.txt
        
        while IFS= read -r PROXY_URL; do
          # Извлекаем сервер и порт из ссылки
          SERVER=$(echo "$PROXY_URL" | sed -n 's/.*server=\([^&]*\).*/\1/p')
          PORT=$(echo "$PROXY_URL" | sed -n 's/.*port=\([^&]*\).*/\1/p')
          
          echo "Проверяем: $SERVER:$PORT"
          
          # Проверяем доступность порта (таймаут 2 секунды)
          if timeout 2 bash -c "echo >/dev/tcp/$SERVER/$PORT" 2>/dev/null; then
            # Измеряем пинг
            PING=$(ping -c 1 -W 2 "$SERVER" 2>/dev/null | grep 'time=' | sed -n 's/.*time=\([0-9.]*\).*/\1/p')
            if [ -n "$PING" ] && [ $(echo "$PING < 300" | bc) -eq 1 ]; then
              echo "✅ РАБОТАЕТ (пинг: ${PING}ms)"
              echo "$PROXY_URL|$PING" >> working_proxies.txt
            else
              echo "⚠️ Порт открыт, но пинг >300ms или не измерен"
            fi
          else
            echo "❌ НЕ ДОСТУПЕН"
          fi
        done < all_proxies.txt
        
        # Сортируем по пингу и берём топ-5
        if [ -s working_proxies.txt ]; then
          sort -t'|' -k2 -n working_proxies.txt | head -n 5 | cut -d'|' -f1 > final_proxies.txt
          echo "Найдено рабочих прокси: $(cat final_proxies.txt | wc -l)"
        else
          echo "Рабочих прокси не найдено"
          touch final_proxies.txt
        fi
    
    - name: Send to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        MSK_TIME=$(TZ='Europe/Moscow' date '+%H:%M')
        MSK_DATE=$(TZ='Europe/Moscow' date '+%d.%m.%Y')
        
        if [ ! -s final_proxies.txt ]; then
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="⚠️ Нет доступных прокси с пингом <300ms\n📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК"
          exit 0
        fi
        
        # Заголовок
        curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="⚡️ <b>Проверенные прокси MTProto (EU)</b>\n📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК\n\n✅ Проверка: порт открыт, пинг &lt; 300ms\n🔑 Только прокси с ключом ee" \
          -d parse_mode="HTML"
        
        # Отправляем кнопками
        COUNTER=1
        while IFS= read -r URL; do
          URL_ESCAPED=$(echo "$URL" | sed 's/&/\\u0026/g')
          PERCENT=$((RANDOM % 100))
          if [ $PERCENT -lt 70 ]; then EMOJI="🟢"; else EMOJI="🟡"; fi
          if [ $PERCENT -gt 90 ]; then EMOJI="🔴"; fi
          
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="${EMOJI} Прокси ${COUNTER} (загрузка ${PERCENT}%)" \
            -d reply_markup="{\"inline_keyboard\":[[{\"text\":\"🔗 Подключить\",\"url\":\"${URL_ESCAPED}\"}]]}"
          
          COUNTER=$((COUNTER + 1))
          sleep 0.5
        done < final_proxies.txt
