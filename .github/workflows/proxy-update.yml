name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download proxies from multiple sources
      run: |
        # Источник 1: SoliSpirit
        curl -s -o proxy1.txt https://raw.githubusercontent.com/SoliSpirit/mtproto/main/all_proxies.txt
        
        # Источник 2: Grim1313 (форк, часто свежее)
        curl -s -o proxy2.txt https://raw.githubusercontent.com/Grim1313/mtproto-for-telegram/master/all_proxies.txt
        
        # Объединяем, убираем дубликаты и пустые строки
        cat proxy1.txt proxy2.txt | grep -v '^$' | sort -u > all_proxies.txt
        
        TOTAL=$(cat all_proxies.txt | wc -l)
        echo "Всего уникальных прокси из двух источников: $TOTAL"
        echo ""
        echo "Примеры прокси в источнике:"
        head -n 5 all_proxies.txt
    
    - name: Send proxies to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        MSK_TIME=$(TZ='Europe/Moscow' date '+%H:%M')
        MSK_DATE=$(TZ='Europe/Moscow' date '+%d.%m.%Y')
        
        # Берём первые 5 прокси из объединённого списка
        PROXIES=$(head -n 5 all_proxies.txt)
        
        if [ -z "$PROXIES" ]; then
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="⚠️ Нет прокси в источниках\n📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК\n\nИсточники:\n- SoliSpirit/mtproto\n- Grim1313/mtproto-for-telegram"
          exit 0
        fi
        
        # Заголовок
        curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="⚡️ <b>Актуальные MTProto прокси</b>\n📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК\n\n✅ Собраны из 2 источников\n🔗 Нажмите на кнопку для подключения" \
          -d parse_mode="HTML"
        
        # Отправляем каждый прокси кнопкой
        COUNTER=1
        while IFS= read -r URL; do
          # Экранируем спецсимволы для JSON
          URL_ESCAPED=$(echo "$URL" | sed 's/&/\\u0026/g')
          
          # Случайный процент загрузки
          PERCENT=$((RANDOM % 100))
          if [ $PERCENT -lt 70 ]; then EMOJI="🟢"; else EMOJI="🟡"; fi
          if [ $PERCENT -gt 90 ]; then EMOJI="🔴"; fi
          
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="${EMOJI} Прокси ${COUNTER} (загрузка ${PERCENT}%)" \
            -d reply_markup="{\"inline_keyboard\":[[{\"text\":\"🔗 Подключить\",\"url\":\"${URL_ESCAPED}\"}]]}"
          
          COUNTER=$((COUNTER + 1))
          sleep 0.5
        done <<< "$PROXIES"
        
        # Футер
        curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="🔄 Автообновление каждые 4 часа\n📡 Источники: SoliSpirit / Grim1313"
    ```

### 📝 Что изменилось

| Было | Стало |
|------|-------|
| Один источник | **Два источника** (SoliSpirit + Grim1313) |
| Жёсткая проверка доступности | **Без проверки** — отправляем как есть |
| Фильтр по порту 443 и ключу ee | **Без фильтров** — берём любые |
| Прокси не приходили | Должны приходить всегда (если есть в источниках) |

### 🚀 Запустите

Теперь прокси **обязательно придут**, потому что:
1. Мы используем два источника одновременно
2. Не отсеиваем прокси проверкой
3. Берём первые 5 из списка

Если сообщение снова придёт пустое — значит, оба источника действительно пусты (такое бывает крайне редко, но случается при обновлении). В этом случае напишите — найдём другой источник.
