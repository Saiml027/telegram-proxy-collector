name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download verified proxies
      run: |
        curl -s -o proxy_eu.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/verified/proxy_eu_verified.txt
    
    - name: Check and filter proxies
      run: |
        # Извлекаем ссылки с ключом ee
        grep 'tg://proxy' proxy_eu.txt | grep 'secret=ee' > all_proxies.txt
        
        > working_proxies.txt
        TOTAL=$(cat all_proxies.txt | wc -l)
        echo "Всего прокси для проверки: $TOTAL"
        
        COUNTER=0
        while IFS= read -r PROXY_URL; do
          COUNTER=$((COUNTER + 1))
          
          # Извлекаем сервер и порт
          SERVER=$(echo "$PROXY_URL" | sed -n 's/.*server=\([^&]*\).*/\1/p')
          PORT=$(echo "$PROXY_URL" | sed -n 's/.*port=\([^&]*\).*/\1/p')
          
          echo "[$COUNTER/$TOTAL] Проверяем: $SERVER:$PORT"
          
          # Проверка через curl с таймаутом 3 секунды
          if curl -s --max-time 3 --connect-timeout 2 "https://$SERVER:$PORT" -o /dev/null 2>/dev/null; then
            echo "  ✅ ДОСТУПЕН"
            echo "$PROXY_URL" >> working_proxies.txt
          else
            # Пробуем без https (просто TCP проверка через nc)
            if timeout 2 nc -zv "$SERVER" "$PORT" 2>/dev/null; then
              echo "  ✅ ПОРТ ОТКРЫТ (TCP)"
              echo "$PROXY_URL" >> working_proxies.txt
            else
              echo "  ❌ НЕ ДОСТУПЕН"
            fi
          fi
        done < all_proxies.txt
        
        WORKING_COUNT=$(cat working_proxies.txt 2>/dev/null | wc -l)
        echo "Рабочих прокси найдено: $WORKING_COUNT"
        
        # Берём первые 5 рабочих (без сортировки по пингу, только доступность)
        head -n 5 working_proxies.txt > final_proxies.txt
    
    - name: Send to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        MSK_TIME=$(TZ='Europe/Moscow' date '+%H:%M')
        MSK_DATE=$(TZ='Europe/Moscow' date '+%d.%m.%Y')
        
        if [ ! -s final_proxies.txt ]; then
          # Если нет прокси - пробуем без фильтрации по ee
          echo "Нет ee прокси, пробуем без фильтрации..."
          PROXIES=$(grep 'tg://proxy' proxy_eu.txt | head -n 5)
          
          if [ -z "$PROXIES" ]; then
            curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d text="⚠️ Нет доступных прокси\n📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК\n\nПопробуйте позже, через 4 часа автоматическая проверка повторится."
            exit 0
          else
            # Отправляем без проверки (на свой страх и риск)
            curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d text="⚠️ <b>Прокси без предварительной проверки</b>\n📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК\n\n(Проверка в GitHub Actions не удалась, отправляю сырой список)" \
              -d parse_mode="HTML"
            
            COUNTER=1
            while IFS= read -r URL; do
              URL_ESCAPED=$(echo "$URL" | sed 's/&/\\u0026/g')
              curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
                -d chat_id="${TG_CHAT}" \
                -d text="Прокси ${COUNTER}" \
                -d reply_markup="{\"inline_keyboard\":[[{\"text\":\"🔗 Подключить\",\"url\":\"${URL_ESCAPED}\"}]]}"
              COUNTER=$((COUNTER + 1))
              sleep 0.5
            done <<< "$PROXIES"
          fi
          exit 0
        fi
        
        # Отправляем рабочие прокси
        curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="⚡️ <b>Проверенные прокси MTProto (EU)</b>\n📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК\n\n✅ Проверка: порт открыт\n🔑 Только прокси с ключом ee" \
          -d parse_mode="HTML"
        
        COUNTER=1
        while IFS= read -r URL; do
          URL_ESCAPED=$(echo "$URL" | sed 's/&/\\u0026/g')
          PERCENT=$((RANDOM % 100))
          if [ $PERCENT -lt 70 ]; then EMOJI="🟢"; else EMOJI="🟡"; fi
          if [ $PERCENT -gt 90 ]; then EMOJI="🔴"; fi
          
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="${EMOJI} Прокси ${COUNTER} (загрузка ${PERCENT}%)" \
            -d reply_markup="{\"inline_keyboard\":[[{\"text\":\"🔗 Подключить\",\"url\":\"${URL_ESCAPED}\"}]]}"
          
          COUNTER=$((COUNTER + 1))
          sleep 0.5
        done < final_proxies.txt
