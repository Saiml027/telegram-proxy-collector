name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: pip install requests telethon
    - run: python main.py --top 200
      env:
        MTPROXY_API_ID: ${{ secrets.MTPROXY_API_ID }}
        MTPROXY_API_HASH: ${{ secrets.MTPROXY_API_HASH }}
    - run: |
        cp verified/proxy_ru_verified.txt proxy_ru.txt
        cp verified/proxy_eu_verified.txt proxy_eu.txt
        cp verified/proxy_all_verified.txt proxy_all.txt
        cp verified/socks5_proxies.txt socks5.txt || true
    - run: |
        git config user.name "Proxy Bot"
        git config user.email "bot@github.com"
        git add verified/ proxy_ru.txt proxy_eu.txt proxy_all.txt socks5.txt || true
        git diff --staged --quiet || git commit -m "Verified proxies $(date)"
        git push || true
    - name: Send to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        # Проверяем все три файла
        RU_PROXIES=$(grep -E '^https?://t\.me/proxy\?' proxy_ru.txt 2>/dev/null | head -n 3)
        EU_PROXIES=$(grep -E '^https?://t\.me/proxy\?' proxy_eu.txt 2>/dev/null | head -n 3)
        ALL_PROXIES=$(grep -E '^https?://t\.me/proxy\?' proxy_all.txt 2>/dev/null | head -n 3)
        
        # Получаем дату обновления из любого файла
        UPDATE_DATE=$(head -n 2 proxy_ru.txt | grep "Updated:" | sed 's/# Updated: //' | cut -d'.' -f1 | tr ' ' '_' || date)
        
        # Формируем сообщение
        MESSAGE="📡 *Свежие прокси MTProto*%0A"
        MESSAGE="${MESSAGE}Обновлено: ${UPDATE_DATE} UTC%0A%0A"
        
        SENT=0
        
        if [ -n "$RU_PROXIES" ]; then
          MESSAGE="${MESSAGE}🇷🇺 *РФ (маскировка Яндекс/ВК)*%0A"
          MESSAGE="${MESSAGE}${RU_PROXIES}%0A%0A"
          SENT=1
        fi
        
        if [ -n "$EU_PROXIES" ]; then
          MESSAGE="${MESSAGE}🇪🇺 *EU (маскировка Google/Amazon)*%0A"
          MESSAGE="${MESSAGE}${EU_PROXIES}%0A%0A"
          SENT=1
        fi
        
        if [ -n "$ALL_PROXIES" ]; then
          MESSAGE="${MESSAGE}🌍 *Все прокси*%0A"
          MESSAGE="${MESSAGE}${ALL_PROXIES}%0A%0A"
          SENT=1
        fi
        
        if [ $SENT -eq 0 ]; then
          MESSAGE="${MESSAGE}⚠️ *Не найдено ни одного рабочего прокси*%0A"
          MESSAGE="${MESSAGE}Следующая попытка через 4 часа."
        fi
        
        # Отправляем
        curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="${MESSAGE}" \
          -d parse_mode="Markdown"
