name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download verified proxies
      run: |
        curl -s -o proxy_eu.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_eu.txt
    
    - name: Send to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        # Берём первые 5 прокси
        PROXIES=$(grep 'tg://proxy' proxy_eu.txt | head -n 5)
        
        if [ -z "$PROXIES" ]; then
          echo "Прокси не найдены"
          exit 0
        fi
        
        # Формируем кнопки
        KEYBOARD='{"inline_keyboard":['
        COUNTER=1
        
        while IFS= read -r URL; do
          KEYBOARD="${KEYBOARD}[{\"text\":\"Прокси ${COUNTER}\",\"url\":\"${URL}\"}],"
          COUNTER=$((COUNTER + 1))
        done <<< "$PROXIES"
        
        KEYBOARD="${KEYBOARD%,}]}"
        
        # Отправляем
        curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="✅ Доступные прокси (нажмите на кнопку)" \
          -d reply_markup="${KEYBOARD}"
