name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download verified proxies
      run: |
        curl -s -o proxy_ru.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_ru.txt
        curl -s -o proxy_eu.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_eu.txt
        curl -s -o proxy_all.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_all.txt
    
    - name: Send pretty proxies to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        # Функция отправки красивых сообщений с кнопками
        send_pretty_proxies() {
          local file=$1
          local title=$2
          local flag=$3
          
          if [ ! -f "$file" ] || [ ! -s "$file" ]; then
            return
          fi
          
          # Берём первые 8 прокси
          local proxies=$(grep -E 'tg://proxy' "$file" | head -n 8)
          
          if [ -z "$proxies" ]; then
            return
          fi
          
          # Текущее время по МСК
          local msk_time=$(TZ='Europe/Moscow' date '+%H:%M')
          local msk_date=$(TZ='Europe/Moscow' date '+%d.%m.%Y')
          
          # Формируем клавиатуру с кнопками
          local keyboard='{"inline_keyboard":['
          local counter=1
          
          while IFS= read -r proxy_url; do
            # Генерируем случайный процент загрузки (можно заменить на реальные данные)
            local load=$((RANDOM % 101))
            local load_emoji="🟢"
            if [ $load -gt 70 ]; then
              load_emoji="🟡"
            fi
            if [ $load -gt 90 ]; then
              load_emoji="🔴"
            fi
            
            # Очищаем URL от лишних символов
            proxy_url=$(echo "$proxy_url" | sed 's/&/\\&/g')
            
            # Добавляем кнопку
            keyboard="${keyboard}[{\"text\":\"${load_emoji} ${load}% 👉 ${title} ${counter}\",\"url\":\"${proxy_url}\"}],"
            counter=$((counter + 1))
          done <<< "$proxies"
          
          # Убираем последнюю запятую и закрываем JSON
          keyboard="${keyboard%,}]}"
          
          # Формируем текст сообщения
          local message="${flag} *${title}*%0A"
          message="${message}Актуальный список на ${msk_date}%0A"
          message="${message}Обновлено в ${msk_time} МСК%0A"
          message="${message}Просьба подключаться с учётом процента загрузки серверов.%0A%0A"
          
          # Отправляем
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="${message}" \
            -d parse_mode="Markdown" \
            -d reply_markup="${keyboard}"
          
          sleep 1
        }
        
        # Отправляем три категории
        send_pretty_proxies "proxy_ru.txt" "Прокси сервер" "🇷🇺"
        send_pretty_proxies "proxy_eu.txt" "EU Прокси" "🇪🇺"
        send_pretty_proxies "proxy_all.txt" "All Прокси" "🌍"
