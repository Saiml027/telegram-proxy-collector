name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download verified proxies
      run: |
        curl -s -o proxy_ru.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_ru.txt
        curl -s -o proxy_eu.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_eu.txt
        curl -s -o proxy_all.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_all.txt
        
        echo "=== РАЗМЕРЫ ФАЙЛОВ ==="
        ls -la proxy_*.txt
        
        echo "=== ПЕРВЫЕ 3 СТРОКИ proxy_eu.txt ==="
        head -n 3 proxy_eu.txt
        
        echo "=== ПОИСК tg://proxy в proxy_eu.txt ==="
        grep 'tg://proxy' proxy_eu.txt | head -n 3
    
    - name: Send to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        # Проверяем переменные
        echo "=== ПРОВЕРКА СЕКРЕТОВ ==="
        echo "TG_BOT длина: ${#TG_BOT}"
        echo "TG_CHAT: $TG_CHAT"
        
        # Проверяем, что есть прокси
        RU_PROXIES=$(grep 'tg://proxy' proxy_ru.txt 2>/dev/null | head -n 3)
        EU_PROXIES=$(grep 'tg://proxy' proxy_eu.txt 2>/dev/null | head -n 3)
        ALL_PROXIES=$(grep 'tg://proxy' proxy_all.txt 2>/dev/null | head -n 3)
        
        echo "=== НАЙДЕННЫЕ ПРОКСИ ==="
        echo "RU: $RU_PROXIES"
        echo "EU: $EU_PROXIES"
        echo "ALL: $ALL_PROXIES"
        
        # Проверяем, можем ли отправить простое сообщение
        echo "=== ОТПРАВКА ТЕСТОВОГО СООБЩЕНИЯ ==="
        curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="🔧 Тест: бот работает, время $(date)" \
          --max-time 10
        
        echo ""
        echo "=== ОТПРАВКА С КНОПКАМИ ==="
        
        # Функция отправки
        send_category() {
          local proxies="$1"
          local title="$2"
          local flag="$3"
          
          if [ -z "$proxies" ]; then
            echo "Нет прокси для $title"
            return
          fi
          
          local keyboard='{"inline_keyboard":['
          local counter=1
          
          while IFS= read -r proxy_url; do
            PERCENT=$((RANDOM % 100))
            if [ $PERCENT -lt 70 ]; then EMOJI="🟢"; else EMOJI="🟡"; fi
            if [ $PERCENT -gt 90 ]; then EMOJI="🔴"; fi
            
            keyboard="${keyboard}[{\"text\":\"${EMOJI} ${PERCENT}% 👉 ${title} ${counter}\",\"url\":\"${proxy_url}\"}],"
            counter=$((counter + 1))
          done <<< "$proxies"
          
          keyboard="${keyboard%,}]}"
          
          echo "Отправляем $title, JSON: $keyboard"
          
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="${flag} ${title}" \
            -d reply_markup="${keyboard}"
          
          echo ""
          sleep 1
        }
        
        send_category "$RU_PROXIES" "Россия" "🇷🇺"
        send_category "$EU_PROXIES" "Европа" "🇪🇺"
        send_category "$ALL_PROXIES" "Все прокси" "🌍"
