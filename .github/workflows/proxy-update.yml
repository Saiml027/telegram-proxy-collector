name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download proxies from SoliSpirit source
      run: |
        # Скачиваем прокси из лучшего источника
        curl -s -o proxy_all.txt https://raw.githubusercontent.com/SoliSpirit/mtproto/main/all_proxies.txt
        
        echo "=== Всего прокси в файле ==="
        wc -l proxy_all.txt
        
        echo "=== Прокси с портом 443 и ключом ee ==="
        grep 'port=443' proxy_all.txt | grep 'secret=ee' | wc -l
    
    - name: Filter and check proxies
      run: |
        # Фильтруем: только порт 443, только ключ ee, только уникальные
        grep 'port=443' proxy_all.txt | grep 'secret=ee' | sort -u > filtered_proxies.txt
        
        TOTAL=$(cat filtered_proxies.txt | wc -l)
        echo "Найдено прокси с портом 443 и ключом ee: $TOTAL"
        
        # Проверяем доступность через curl (быстрая проверка)
        > working_proxies.txt
        COUNTER=0
        CHECKED=0
        
        while IFS= read -r PROXY_URL; do
          CHECKED=$((CHECKED + 1))
          
          # Извлекаем сервер
          SERVER=$(echo "$PROXY_URL" | sed -n 's/.*server=\([^&]*\).*/\1/p')
          PORT=$(echo "$PROXY_URL" | sed -n 's/.*port=\([^&]*\).*/\1/p')
          
          echo "[$CHECKED/$TOTAL] Проверяем: $SERVER:$PORT"
          
          # Быстрая проверка: просто проверяем, открыт ли порт
          if timeout 2 bash -c "echo >/dev/tcp/$SERVER/$PORT" 2>/dev/null; then
            echo "  ✅ ДОСТУПЕН"
            echo "$PROXY_URL" >> working_proxies.txt
            COUNTER=$((COUNTER + 1))
          else
            echo "  ❌ НЕТ ДОСТУПА"
          fi
          
          # Если нашли 10 рабочих - хватит
          if [ $COUNTER -ge 10 ]; then
            echo "Найдено 10 рабочих прокси, останавливаем проверку"
            break
          fi
        done < filtered_proxies.txt
        
        # Берём первые 5 рабочих
        head -n 5 working_proxies.txt > final_proxies.txt
        echo "Итоговых прокси для отправки: $(cat final_proxies.txt | wc -l)"
        
        # Если нет рабочих, берём без проверки (но отфильтрованные)
        if [ ! -s final_proxies.txt ]; then
          echo "Рабочих не найдено, отправляем отфильтрованные без проверки"
          head -n 5 filtered_proxies.txt > final_proxies.txt
        fi
    
    - name: Send to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        MSK_TIME=$(TZ='Europe/Moscow' date '+%H:%M')
        MSK_DATE=$(TZ='Europe/Moscow' date '+%d.%m.%Y')
        
        if [ ! -s final_proxies.txt ]; then
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="⚠️ Нет прокси с портом 443 и ключом ee\n📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК\n\nИсточник: SoliSpirit/mtproto"
          exit 0
        fi
        
        # Заголовок
        curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="⚡️ <b>Проверенные прокси MTProto</b>\n📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК\n\n✅ Источник: SoliSpirit/mtproto\n🔑 Порт 443 | Ключ ee (Fake TLS)\n🚀 Оптимально для обхода DPI" \
          -d parse_mode="HTML"
        
        # Отправляем каждый прокси кнопкой
        COUNTER=1
        while IFS= read -r URL; do
          # Экранируем спецсимволы для JSON
          URL_ESCAPED=$(echo "$URL" | sed 's/&/\\u0026/g')
          
          # Случайный процент загрузки для красоты
          PERCENT=$((RANDOM % 100))
          if [ $PERCENT -lt 70 ]; then EMOJI="🟢"; else EMOJI="🟡"; fi
          if [ $PERCENT -gt 90 ]; then EMOJI="🔴"; fi
          
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="${EMOJI} Прокси ${COUNTER} (загрузка ${PERCENT}%)" \
            -d reply_markup="{\"inline_keyboard\":[[{\"text\":\"🔗 Подключить\",\"url\":\"${URL_ESCAPED}\"}]]}"
          
          COUNTER=$((COUNTER + 1))
          sleep 0.5
        done < final_proxies.txt
        
        # Футер
        curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="🔄 Обновление каждые 4 часа\n📡 Автоматическая проверка доступности" \
          -d parse_mode="HTML"
