name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download verified proxies
      run: |
        curl -s -o proxy_ru.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_ru.txt
        curl -s -o proxy_eu.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_eu.txt
        curl -s -o proxy_all.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_all.txt
    
    - name: Send to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        # Получаем время
        MSK_TIME=$(TZ='Europe/Moscow' date '+%H:%M')
        MSK_DATE=$(TZ='Europe/Moscow' date '+%d.%m.%Y')
        
        # Берём прокси (каждую ссылку отдельно)
        RU_PROXIES=$(grep 'tg://proxy' proxy_ru.txt 2>/dev/null | head -n 5)
        EU_PROXIES=$(grep 'tg://proxy' proxy_eu.txt 2>/dev/null | head -n 5)
        ALL_PROXIES=$(grep 'tg://proxy' proxy_all.txt 2>/dev/null | head -n 5)
        
        # Формируем текст
        TEXT="⚡️ *Актуальные прокси MTProto*\n📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК\nПросьба подключаться с учётом загрузки серверов.\n\n"
        
        if [ -n "$RU_PROXIES" ]; then
          TEXT="${TEXT}🇷🇺 *Россия*\n"
          COUNTER=1
          while IFS= read -r line; do
            TEXT="${TEXT}🟢 Прокси ${COUNTER}: ${line}\n"
            COUNTER=$((COUNTER + 1))
          done <<< "$RU_PROXIES"
          TEXT="${TEXT}\n"
        fi
        
        if [ -n "$EU_PROXIES" ]; then
          TEXT="${TEXT}🇪🇺 *Европа*\n"
          COUNTER=1
          while IFS= read -r line; do
            TEXT="${TEXT}🟢 Прокси ${COUNTER}: ${line}\n"
            COUNTER=$((COUNTER + 1))
          done <<< "$EU_PROXIES"
          TEXT="${TEXT}\n"
        fi
        
        if [ -n "$ALL_PROXIES" ]; then
          TEXT="${TEXT}🌍 *Все прокси*\n"
          COUNTER=1
          while IFS= read -r line; do
            TEXT="${TEXT}🟢 Прокси ${COUNTER}: ${line}\n"
            COUNTER=$((COUNTER + 1))
          done <<< "$ALL_PROXIES"
        fi
        
        # Отправляем
        curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="${TEXT}" \
          -d parse_mode="Markdown" \
          --max-time 30
        
        echo "Готово!"
