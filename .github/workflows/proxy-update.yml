name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download verified proxies
      run: |
        curl -s -o proxy_eu.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_eu.txt
    
    - name: Send to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        # Получаем прокси
        PROXIES=$(grep 'tg://proxy' proxy_eu.txt | head -n 5)
        
        if [ -z "$PROXIES" ]; then
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="⚠️ Прокси временно отсутствуют"
          exit 0
        fi
        
        # Отправляем заголовок
        curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="✅ <b>Доступные прокси</b> (нажмите на кнопку)" \
          -d parse_mode="HTML"
        
        # Отправляем каждый прокси отдельной кнопкой
        COUNTER=1
        while IFS= read -r URL; do
          # Экранируем для JSON
          URL_ESCAPED=$(echo "$URL" | sed 's/&/\\u0026/g')
          
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="Прокси ${COUNTER}" \
            -d reply_markup="{\"inline_keyboard\":[[{\"text\":\"🔗 Подключить\",\"url\":\"${URL_ESCAPED}\"}]]}"
          
          COUNTER=$((COUNTER + 1))
          sleep 0.5
        done <<< "$PROXIES"
