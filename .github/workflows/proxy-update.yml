name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download verified proxies
      run: |
        curl -s -o proxy_ru.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_ru.txt
        curl -s -o proxy_eu.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_eu.txt
        curl -s -o proxy_all.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_all.txt
    
    - name: Send to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        # Получаем время по МСК
        MSK_TIME=$(TZ='Europe/Moscow' date '+%H:%M')
        MSK_DATE=$(TZ='Europe/Moscow' date '+%d.%m.%Y')
        
        # Берём прокси
        RU_PROXIES=$(grep -E 'tg://proxy' proxy_ru.txt 2>/dev/null | head -n 5)
        EU_PROXIES=$(grep -E 'tg://proxy' proxy_eu.txt 2>/dev/null | head -n 5)
        ALL_PROXIES=$(grep -E 'tg://proxy' proxy_all.txt 2>/dev/null | head -n 5)
        
        # Начинаем формировать сообщение
        MESSAGE="⚡️ *Актуальные прокси MTProto*%0A"
        MESSAGE="${MESSAGE}📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК%0A"
        MESSAGE="${MESSAGE}Просьба подключаться с учётом загрузки серверов.%0A%0A"
        
        # Функция для добавления прокси в сообщение
        add_proxies() {
          local proxies="$1"
          local title="$2"
          local prefix="$3"
          
          if [ -n "$proxies" ]; then
            MESSAGE="${MESSAGE}${title}%0A"
            local counter=1
            while IFS= read -r line; do
              PERCENT=$((RANDOM % 100))
              if [ $PERCENT -lt 70 ]; then EMOJI="🟢"; else EMOJI="🟡"; fi
              if [ $PERCENT -gt 90 ]; then EMOJI="🔴"; fi
              MESSAGE="${MESSAGE}${EMOJI} ${PERCENT}% 👉 [${prefix} ${counter}](${line})%0A"
              counter=$((counter + 1))
            done <<< "$proxies"
            MESSAGE="${MESSAGE}%0A"
          fi
        }
        
        # Добавляем каждую категорию
        if [ -n "$RU_PROXIES" ]; then
          MESSAGE="${MESSAGE}🇷🇺 *Россия*%0A"
          counter=1
          while IFS= read -r line; do
            PERCENT=$((RANDOM % 100))
            if [ $PERCENT -lt 70 ]; then EMOJI="🟢"; else EMOJI="🟡"; fi
            if [ $PERCENT -gt 90 ]; then EMOJI="🔴"; fi
            MESSAGE="${MESSAGE}${EMOJI} ${PERCENT}% 👉 [Прокси ${counter}](${line})%0A"
            counter=$((counter + 1))
          done <<< "$RU_PROXIES"
          MESSAGE="${MESSAGE}%0A"
        fi
        
        if [ -n "$EU_PROXIES" ]; then
          MESSAGE="${MESSAGE}🇪🇺 *Европа*%0A"
          counter=1
          while IFS= read -r line; do
            PERCENT=$((RANDOM % 100))
            if [ $PERCENT -lt 70 ]; then EMOJI="🟢"; else EMOJI="🟡"; fi
            if [ $PERCENT -gt 90 ]; then EMOJI="🔴"; fi
            MESSAGE="${MESSAGE}${EMOJI} ${PERCENT}% 👉 [EU ${counter}](${line})%0A"
            counter=$((counter + 1))
          done <<< "$EU_PROXIES"
          MESSAGE="${MESSAGE}%0A"
        fi
        
        if [ -n "$ALL_PROXIES" ]; then
          MESSAGE="${MESSAGE}🌍 *Все прокси*%0A"
          counter=1
          while IFS= read -r line; do
            PERCENT=$((RANDOM % 100))
            if [ $PERCENT -lt 70 ]; then EMOJI="🟢"; else EMOJI="🟡"; fi
            if [ $PERCENT -gt 90 ]; then EMOJI="🔴"; fi
            MESSAGE="${MESSAGE}${EMOJI} ${PERCENT}% 👉 [All ${counter}](${line})%0A"
            counter=$((counter + 1))
          done <<< "$ALL_PROXIES"
        fi
        
        # Проверяем, есть ли вообще прокси
        if [ -z "$RU_PROXIES" ] && [ -z "$EU_PROXIES" ] && [ -z "$ALL_PROXIES" ]; then
          MESSAGE="${MESSAGE}⚠️ Прокси временно отсутствуют%0A"
          MESSAGE="${MESSAGE}Следующее обновление через 4 часа"
        fi
        
        # Отправляем
        echo "Отправляем сообщение в Telegram..."
        curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="${MESSAGE}" \
          -d parse_mode="Markdown" \
          --max-time 30
        
        echo "Готово!"
