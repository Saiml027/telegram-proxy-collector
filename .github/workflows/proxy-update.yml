name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download verified proxies
      run: |
        echo "=== Скачиваем файлы ==="
        curl -s -o proxy_ru.txt "https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_ru.txt"
        curl -s -o proxy_eu.txt "https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_eu.txt"
        curl -s -o proxy_all.txt "https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_all.txt"
        
        echo "=== Размеры файлов ==="
        ls -la proxy_*.txt
        
        echo "=== Содержимое proxy_ru.txt (весь файл) ==="
        cat proxy_ru.txt
        
        echo "=== Содержимое proxy_eu.txt (весь файл) ==="
        cat proxy_eu.txt
        
        echo "=== Содержимое proxy_all.txt (весь файл) ==="
        cat proxy_all.txt
        
        echo "=== Поиск ссылок с t.me/proxy ==="
        grep 't.me/proxy' proxy_ru.txt | head -n 5 || echo "В proxy_ru.txt ссылок нет"
        grep 't.me/proxy' proxy_eu.txt | head -n 5 || echo "В proxy_eu.txt ссылок нет"
        grep 't.me/proxy' proxy_all.txt | head -n 5 || echo "В proxy_all.txt ссылок нет"
    
    - name: Send to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        # Ищем ссылки и экранируем спецсимволы для Telegram
        RU_PROXIES=$(grep -E 'tg://proxy' proxy_ru.txt 2>/dev/null | head -n 3 | sed 's/&/%26/g' | sed 's/=/%3D/g' | sed 's/?/%3F/g')
        EU_PROXIES=$(grep -E 'tg://proxy' proxy_eu.txt 2>/dev/null | head -n 3 | sed 's/&/%26/g' | sed 's/=/%3D/g' | sed 's/?/%3F/g')
        ALL_PROXIES=$(grep -E 'tg://proxy' proxy_all.txt 2>/dev/null | head -n 3 | sed 's/&/%26/g' | sed 's/=/%3D/g' | sed 's/?/%3F/g')
        
        MESSAGE="📡 *Свежие прокси MTProto*%0A%0A"
        
        if [ -n "$RU_PROXIES" ]; then
          MESSAGE="${MESSAGE}🇷🇺 *РФ*%0A\`${RU_PROXIES}\`%0A%0A"
        fi
        
        if [ -n "$EU_PROXIES" ]; then
          MESSAGE="${MESSAGE}🇪🇺 *EU*%0A\`${EU_PROXIES}\`%0A%0A"
        fi
        
        if [ -n "$ALL_PROXIES" ]; then
          MESSAGE="${MESSAGE}🌍 *Все прокси*%0A\`${ALL_PROXIES}\`%0A%0A"
        fi
        
        if [ -z "$RU_PROXIES" ] && [ -z "$EU_PROXIES" ] && [ -z "$ALL_PROXIES" ]; then
          MESSAGE="${MESSAGE}⚠️ Прокси не найдены"
        fi
        
        curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="${MESSAGE}" \
          -d parse_mode="Markdown"
