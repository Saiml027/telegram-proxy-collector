name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download verified proxies
      run: |
        echo "=== Скачиваем proxy_ru.txt ==="
        curl -v -o proxy_ru.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_ru.txt
        echo "=== Первые 20 строк proxy_ru.txt ==="
        head -n 20 proxy_ru.txt
        echo "=== Ищем ссылки на прокси в proxy_ru.txt ==="
        grep -c 't.me/proxy' proxy_ru.txt || echo "0 найдено"
        
        echo "=== Скачиваем proxy_eu.txt ==="
        curl -s -o proxy_eu.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_eu.txt
        echo "=== Первые 5 строк proxy_eu.txt ==="
        head -n 5 proxy_eu.txt
        
        echo "=== Скачиваем proxy_all.txt ==="
        curl -s -o proxy_all.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_all.txt
        echo "=== Первые 5 строк proxy_all.txt ==="
        head -n 5 proxy_all.txt
      
    - name: Send to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        RU_PROXIES=$(grep -E '^https?://t\.me/proxy\?' proxy_ru.txt 2>/dev/null | head -n 5)
        EU_PROXIES=$(grep -E '^https?://t\.me/proxy\?' proxy_eu.txt 2>/dev/null | head -n 5)
        ALL_PROXIES=$(grep -E '^https?://t\.me/proxy\?' proxy_all.txt 2>/dev/null | head -n 5)
        
        MESSAGE="📡 Свежие прокси MTProto\n\n"
        
        if [ -n "$RU_PROXIES" ]; then
          MESSAGE="${MESSAGE}🇷🇺 РФ (маскировка Яндекс/ВК)\n${RU_PROXIES}\n\n"
        fi
        
        if [ -n "$EU_PROXIES" ]; then
          MESSAGE="${MESSAGE}🇪🇺 EU (маскировка Google/Amazon)\n${EU_PROXIES}\n\n"
        fi
        
        if [ -n "$ALL_PROXIES" ]; then
          MESSAGE="${MESSAGE}🌍 Все прокси\n${ALL_PROXIES}\n\n"
        fi
        
        curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="${MESSAGE}"
