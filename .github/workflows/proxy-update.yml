name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download verified proxies
      run: |
        curl -s -o proxy_eu.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_eu.txt
    
    - name: Filter and send working proxies
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        # Фильтруем только прокси с секретом начинающимся на ee
        PROXIES=$(grep 'tg://proxy' proxy_eu.txt | grep 'secret=ee' | head -n 5)
        
        if [ -z "$PROXIES" ]; then
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="⚠️ Нет рабочих прокси с ключом ee. Проверка через 4 часа."
          exit 0
        fi
        
        # Получаем время
        MSK_TIME=$(TZ='Europe/Moscow' date '+%H:%M')
        MSK_DATE=$(TZ='Europe/Moscow' date '+%d.%m.%Y')
        
        # Отправляем заголовок
        curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="⚡️ <b>Рабочие прокси MTProto (EU)</b>\n📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК\nПросьба подключаться с учётом загрузки серверов.\n\n🔑 Отобраны только прокси с ключом ee (самые стабильные)" \
          -d parse_mode="HTML"
        
        # Отправляем каждый прокси отдельной кнопкой
        COUNTER=1
        while IFS= read -r URL; do
          # Экранируем для JSON
          URL_ESCAPED=$(echo "$URL" | sed 's/&/\\u0026/g')
          
          # Случайный процент загрузки
          PERCENT=$((RANDOM % 100))
          if [ $PERCENT -lt 70 ]; then EMOJI="🟢"; else EMOJI="🟡"; fi
          if [ $PERCENT -gt 90 ]; then EMOJI="🔴"; fi
          
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="${EMOJI} Прокси ${COUNTER} (загрузка ${PERCENT}%)" \
            -d reply_markup="{\"inline_keyboard\":[[{\"text\":\"🔗 Подключить\",\"url\":\"${URL_ESCAPED}\"}]]}"
          
          COUNTER=$((COUNTER + 1))
          sleep 0.5
        done <<< "$PROXIES"
