name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download proxies from SoliSpirit source
      run: |
        # Скачиваем прокси из лучшего источника
        curl -s -o proxy_all.txt https://raw.githubusercontent.com/SoliSpirit/mtproto/main/all_proxies.txt
        
        echo "=== Всего прокси в файле ==="
        wc -l proxy_all.txt
        
        echo "=== Первые 10 прокси ==="
        head -n 10 proxy_all.txt
    
    - name: Filter and check proxies
      run: |
        # Убираем дубликаты и пустые строки
        grep -v '^$' proxy_all.txt | sort -u > unique_proxies.txt
        
        TOTAL=$(cat unique_proxies.txt | wc -l)
        echo "Уникальных прокси: $TOTAL"
        
        # Проверяем доступность через быстрый TCP-коннект
        > working_proxies.txt
        CHECKED=0
        FOUND=0
        
        while IFS= read -r PROXY_URL; do
          CHECKED=$((CHECKED + 1))
          
          # Извлекаем сервер и порт
          SERVER=$(echo "$PROXY_URL" | sed -n 's/.*server=\([^&]*\).*/\1/p')
          PORT=$(echo "$PROXY_URL" | sed -n 's/.*port=\([^&]*\).*/\1/p')
          
          # Если не удалось извлечь порт, пропускаем
          if [ -z "$SERVER" ] || [ -z "$PORT" ]; then
            continue
          fi
          
          echo "[$CHECKED/$TOTAL] Проверяем: $SERVER:$PORT"
          
          # Проверка открытия порта (таймаут 2 секунды)
          if timeout 2 bash -c "echo >/dev/tcp/$SERVER/$PORT" 2>/dev/null; then
            echo "  ✅ ДОСТУПЕН"
            echo "$PROXY_URL" >> working_proxies.txt
            FOUND=$((FOUND + 1))
          else
            echo "  ❌ НЕТ ДОСТУПА"
          fi
          
          # Если нашли 10 рабочих - достаточно
          if [ $FOUND -ge 10 ]; then
            echo "Найдено 10 рабочих прокси, проверка завершена"
            break
          fi
        done < unique_proxies.txt
        
        # Берём первые 5 рабочих
        head -n 5 working_proxies.txt > final_proxies.txt
        echo "Итоговых прокси: $(cat final_proxies.txt 2>/dev/null | wc -l)"
        
        # Если рабочих нет - берём любые 5 уникальных без проверки
        if [ ! -s final_proxies.txt ]; then
          echo "Рабочих не найдено, берём любые уникальные"
          head -n 5 unique_proxies.txt > final_proxies.txt
        fi
    
    - name: Send to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        MSK_TIME=$(TZ='Europe/Moscow' date '+%H:%M')
        MSK_DATE=$(TZ='Europe/Moscow' date '+%d.%m.%Y')
        
        if [ ! -s final_proxies.txt ]; then
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="⚠️ Нет прокси в источнике\n📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК\n\nИсточник: SoliSpirit/mtproto\nВозможно, обновление через несколько часов"
          exit 0
        fi
        
        # Заголовок
        curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="⚡️ <b>Рабочие MTProto прокси</b>\n📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК\n\n✅ Источник: SoliSpirit/mtproto [citation:1]\n🔄 Обновление каждые 12 часов\n🚀 Проверка доступности выполнена" \
          -d parse_mode="HTML"
        
        # Отправляем каждый прокси кнопкой
        COUNTER=1
        while IFS= read -r URL; do
          # Экранируем спецсимволы для JSON
          URL_ESCAPED=$(echo "$URL" | sed 's/&/\\u0026/g')
          
          # Случайный процент загрузки для визуала
          PERCENT=$((RANDOM % 100))
          if [ $PERCENT -lt 70 ]; then EMOJI="🟢"; else EMOJI="🟡"; fi
          if [ $PERCENT -gt 90 ]; then EMOJI="🔴"; fi
          
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="${EMOJI} Прокси ${COUNTER} (загрузка ${PERCENT}%)" \
            -d reply_markup="{\"inline_keyboard\":[[{\"text\":\"🔗 Подключить\",\"url\":\"${URL_ESCAPED}\"}]]}"
          
          COUNTER=$((COUNTER + 1))
          sleep 0.5
        done < final_proxies.txt
