name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    # Ключевой момент: Устанавливаем ВСЕ нужные библиотеки, включая socks
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install requests telethon python-socks[asyncio]
    
    # Запускаем скрипт в режиме ПОЛНОЙ проверки с вашими ключами
    - name: Run full collector & checker
      run: python main.py --top 200
      env:
        MTPROXY_API_ID: ${{ secrets.MTPROXY_API_ID }}
        MTPROXY_API_HASH: ${{ secrets.MTPROXY_API_HASH }}
    
    # Копируем проверенные файлы (именно их, а не сырые)
    - name: Copy verified proxies
      run: |
        cp verified/proxy_ru_verified.txt proxy_ru.txt
        cp verified/proxy_eu_verified.txt proxy_eu.txt
        cp verified/proxy_all_verified.txt proxy_all.txt
        cp verified/socks5_proxies.txt socks5.txt || true
    
    # Отправляем результат в Telegram (как в прошлом рабочем примере)
    - name: Send to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        # Получаем время по МСК
        MSK_TIME=$(TZ='Europe/Moscow' date '+%H:%M')
        MSK_DATE=$(TZ='Europe/Moscow' date '+%d.%m.%Y')
        
        # Берём ПРОВЕРЕННЫЕ прокси с ключом ee из отфильтрованного списка
        # Прокси в verified-файлах уже отсортированы по приоритету: сначала probe_resistant, потом по пингу
        PROXIES=$(grep 'tg://proxy' proxy_eu.txt | grep 'secret=ee' | head -n 5)
        
        # Резерв: если нет ee, берём любые из проверенных
        if [ -z "$PROXIES" ]; then
          PROXIES=$(grep 'tg://proxy' proxy_eu.txt | head -n 5)
        fi
        
        if [ -z "$PROXIES" ]; then
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="⚠️ Нет проверенных прокси. Возможно, проблема с API_ID/API_HASH."
          exit 0
        fi
        
        # Заголовок
        curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="⚡️ <b>Проверенные прокси MTProto (EU)</b>\n📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК\n\n✅ Прокси прошли реальную проверку подключением к Telegram\n🔑 Отобраны стабильные и устойчивые к DPI" \
          -d parse_mode="HTML"
        
        # Отправляем кнопками
        COUNTER=1
        while IFS= read -r URL; do
          URL_ESCAPED=$(echo "$URL" | sed 's/&/\\u0026/g')
          
          PERCENT=$((RANDOM % 100))
          if [ $PERCENT -lt 70 ]; then EMOJI="🟢"; else EMOJI="🟡"; fi
          if [ $PERCENT -gt 90 ]; then EMOJI="🔴"; fi
          
          curl -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="${EMOJI} Прокси ${COUNTER} (загрузка ${PERCENT}%)" \
            -d reply_markup="{\"inline_keyboard\":[[{\"text\":\"🔗 Подключить\",\"url\":\"${URL_ESCAPED}\"}]]}"
          
          COUNTER=$((COUNTER + 1))
          sleep 0.5
        done <<< "$PROXIES"
