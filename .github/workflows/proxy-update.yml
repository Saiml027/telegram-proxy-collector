name: Update Verified Proxy Lists

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download verified proxies
      run: |
        curl -s -o proxy_ru.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_ru.txt
        curl -s -o proxy_eu.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_eu.txt
        curl -s -o proxy_all.txt https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/proxy_all.txt
    
    - name: Send to Telegram
      env:
        TG_BOT: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TG_CHAT_ID }}
      run: |
        # Получаем время по МСК
        MSK_TIME=$(TZ='Europe/Moscow' date '+%H:%M')
        MSK_DATE=$(TZ='Europe/Moscow' date '+%d.%m.%Y')
        
        # Берём прокси (правильно извлекаем полные ссылки и экранируем спецсимволы)
        RU_PROXIES=$(grep -E 'tg://proxy' proxy_ru.txt 2>/dev/null | head -n 5 | sed 's/&/%26/g' | sed 's/=/%3D/g' | sed 's/?/%3F/g')
        EU_PROXIES=$(grep -E 'tg://proxy' proxy_eu.txt 2>/dev/null | head -n 5 | sed 's/&/%26/g' | sed 's/=/%3D/g' | sed 's/?/%3F/g')
        ALL_PROXIES=$(grep -E 'tg://proxy' proxy_all.txt 2>/dev/null | head -n 5 | sed 's/&/%26/g' | sed 's/=/%3D/g' | sed 's/?/%3F/g')
        
        # Начинаем сообщение
        MESSAGE="⚡️ <b>Актуальные прокси MTProto</b>\n"
        MESSAGE="${MESSAGE}📅 ${MSK_DATE} | 🕐 ${MSK_TIME} МСК\n"
        MESSAGE="${MESSAGE}Просьба подключаться с учётом загрузки серверов.\n\n"
        
        # Добавляем РФ
        if [ -n "$RU_PROXIES" ]; then
          MESSAGE="${MESSAGE}🇷🇺 <b>Россия</b>\n"
          COUNTER=1
          while IFS= read -r line; do
            PERCENT=$((RANDOM % 100))
            if [ $PERCENT -lt 70 ]; then EMOJI="🟢"; else EMOJI="🟡"; fi
            if [ $PERCENT -gt 90 ]; then EMOJI="🔴"; fi
            MESSAGE="${MESSAGE}${EMOJI} ${PERCENT}% 👉 <code>${line}</code>\n"
            COUNTER=$((COUNTER + 1))
          done <<< "$RU_PROXIES"
          MESSAGE="${MESSAGE}\n"
        fi
        
        # Добавляем EU
        if [ -n "$EU_PROXIES" ]; then
          MESSAGE="${MESSAGE}🇪🇺 <b>Европа</b>\n"
          COUNTER=1
          while IFS= read -r line; do
            PERCENT=$((RANDOM % 100))
            if [ $PERCENT -lt 70 ]; then EMOJI="🟢"; else EMOJI="🟡"; fi
            if [ $PERCENT -gt 90 ]; then EMOJI="🔴"; fi
            MESSAGE="${MESSAGE}${EMOJI} ${PERCENT}% 👉 <code>${line}</code>\n"
            COUNTER=$((COUNTER + 1))
          done <<< "$EU_PROXIES"
          MESSAGE="${MESSAGE}\n"
        fi
        
        # Добавляем ALL
        if [ -n "$ALL_PROXIES" ]; then
          MESSAGE="${MESSAGE}🌍 <b>Все прокси</b>\n"
          COUNTER=1
          while IFS= read -r line; do
            PERCENT=$((RANDOM % 100))
            if [ $PERCENT -lt 70 ]; then EMOJI="🟢"; else EMOJI="🟡"; fi
            if [ $PERCENT -gt 90 ]; then EMOJI="🔴"; fi
            MESSAGE="${MESSAGE}${EMOJI} ${PERCENT}% 👉 <code>${line}</code>\n"
            COUNTER=$((COUNTER + 1))
          done <<< "$ALL_PROXIES"
        fi
        
        # Если нет прокси
        if [ -z "$RU_PROXIES" ] && [ -z "$EU_PROXIES" ] && [ -z "$ALL_PROXIES" ]; then
          MESSAGE="${MESSAGE}⚠️ Прокси временно отсутствуют\n"
          MESSAGE="${MESSAGE}Следующее обновление через 4 часа"
        fi
        
        # Отправляем сообщение
        curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="${MESSAGE}" \
          -d parse_mode="HTML" \
          --max-time 30
